<ol class="checkout-steps" aria-label="Checkout progress">
  {% for number, label in steps %}
    <li class="{% if number < current %}is-done{% elif number == current %}is-current{% endif %}"{% if number == current %} aria-current="step"{% endif %}>
      <span class="checkout-step-dot" aria-hidden="true">{% if number < current %}{% include "partials/icon.html" with name="check" %}{% else %}{{ number }}{% endif %}</span>
      <span>{{ label }}</span>
    </li>
  {% endfor %}
</ol>
